name: Build ttyd Windows 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            base-devel
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-pkgconf
            mingw-w64-i686-json-c
            mingw-w64-i686-libwebsockets
            mingw-w64-i686-openssl

      - name: Clone ttyd
        run: |
          git clone https://github.com/tsl0922/ttyd.git ttyd
          cd ttyd
          git submodule update --init --recursive

      - name: Check compiler
        run: |
          gcc -dumpmachine
          gcc --version
          cmake --version

      - name: Configure
        run: |
          cd ttyd
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd ttyd
          cmake --build build --parallel

      - name: Check executable
        shell: pwsh
        run: |
          Get-Item ttyd/build/ttyd.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist

          Copy-Item ttyd/build/ttyd.exe dist/ttyd.exe

          Compress-Archive `
            -Path dist/ttyd.exe `
            -DestinationPath ttyd-win32.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttyd-windows-32bit
          path: ttyd-win32.zip
