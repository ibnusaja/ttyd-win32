name: Build ttyd Windows 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            base-devel
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-pkgconf
            mingw-w64-i686-json-c
            mingw-w64-i686-openssl

      - name: Checkout ttyd
        uses: actions/checkout@v5
        with:
          repository: tsl0922/ttyd
          path: ttyd

      - name: Check compiler
        shell: msys2 {0}
        run: |
          echo "=== TARGET ==="
          gcc -dumpmachine

          echo "=== GCC ==="
          gcc --version

          echo "=== CMAKE ==="
          cmake --version

      - name: Build libwebsockets
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/warmcat/libwebsockets.git lws

          cd lws

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw32 \
            -DLWS_WITH_SSL=ON \
            -DLWS_WITH_SHARED=ON \
            -DLWS_WITH_STATIC=OFF \
            -DLWS_WITHOUT_TESTAPPS=ON \
            -DLWS_WITHOUT_TEST_SERVER=ON \
            -DLWS_WITHOUT_TEST_PING=ON

          cmake --build build --parallel
          cmake --install build

      - name: Check libwebsockets
        shell: msys2 {0}
        run: |
          echo "=== libwebsockets ==="
          pkg-config --modversion libwebsockets

      - name: Configure ttyd
        shell: msys2 {0}
        run: |
          cd ttyd

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build ttyd
        shell: msys2 {0}
        run: |
          cd ttyd
          cmake --build build --parallel

      - name: Check ttyd
        shell: msys2 {0}
        run: |
          echo "=== ttyd.exe ==="
          ls -lh ttyd/build/ttyd.exe
          file ttyd/build/ttyd.exe

      - name: Collect DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist

          cp ttyd/build/ttyd.exe dist/

          ldd ttyd/build/ttyd.exe || true

          cp /mingw32/bin/libwebsockets*.dll dist/ || true
          cp /mingw32/bin/libssl*.dll dist/ || true
          cp /mingw32/bin/libcrypto*.dll dist/ || true
          cp /mingw32/bin/libjson-c*.dll dist/ || true

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/* `
            -DestinationPath ttyd-win32.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttyd-windows-32bit
          path: ttyd-win32.zip
