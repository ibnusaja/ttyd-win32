name: Build ttyd Windows 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ==========================================
      # MSYS2 / MinGW32
      # ==========================================
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            base-devel
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-pkgconf
            mingw-w64-i686-json-c
            mingw-w64-i686-openssl

      # ==========================================
      # Checkout ttyd
      # ==========================================
      - name: Checkout ttyd
        uses: actions/checkout@v5
        with:
          repository: tsl0922/ttyd
          ref: 1.7.7
          path: ttyd

      # ==========================================
      # Check compiler
      # ==========================================
      - name: Check compiler
        shell: msys2 {0}
        run: |
          echo "=== TARGET ==="
          gcc -dumpmachine

          echo "=== GCC ==="
          gcc --version

          echo "=== CMAKE ==="
          cmake --version

      # ==========================================
      # Clone libwebsockets
      # ==========================================
      - name: Clone libwebsockets
        shell: msys2 {0}
        run: |
          git clone \
            --depth 1 \
            --branch v4.3.3 \
            https://github.com/warmcat/libwebsockets.git \
            lws

      # ==========================================
      # Configure libwebsockets
      # ==========================================
      - name: Configure libwebsockets
        shell: msys2 {0}
        run: |
          cd lws

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw32 \
            -DLWS_WITH_SSL=ON \
            -DLWS_WITH_SHARED=ON \
            -DLWS_WITH_STATIC=OFF \
            -DLWS_WITHOUT_TESTAPPS=ON \
            -DLWS_WITHOUT_TEST_SERVER=ON \
            -DLWS_WITHOUT_TEST_PING=ON \
            -DLWS_WITH_LIBUV=OFF \
            -DLWS_WITH_LIBEVENT=OFF \
            -DLWS_WITH_GLIB=OFF

      # ==========================================
      # Build libwebsockets
      # ==========================================
      - name: Build libwebsockets
        shell: msys2 {0}
        run: |
          cd lws
          cmake --build build --parallel

      # ==========================================
      # Install libwebsockets
      # ==========================================
      - name: Install libwebsockets
        shell: msys2 {0}
        run: |
          cd lws
          cmake --install build

      # ==========================================
      # Verify libwebsockets
      # ==========================================
      - name: Verify libwebsockets
        shell: msys2 {0}
        run: |
          echo "=== LWS files ==="

          ls -lah /mingw32/lib/libwebsockets* || true
          ls -lah /mingw32/bin/libwebsockets* || true

          echo "=== pkg-config ==="

          pkg-config --modversion libwebsockets || true

      # ==========================================
      # Configure ttyd
      # ==========================================
      - name: Configure ttyd
        shell: msys2 {0}
        run: |
          cd ttyd

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86 \
            -DCMAKE_BUILD_TYPE=Release

      # ==========================================
      # Build ttyd
      # ==========================================
      - name: Build ttyd
        shell: msys2 {0}
        run: |
          cd ttyd
          cmake --build build --parallel

      # ==========================================
      # Verify ttyd
      # ==========================================
      - name: Verify ttyd
        shell: msys2 {0}
        run: |
          echo "=== ttyd.exe ==="

          ls -lh ttyd/build/ttyd.exe

          echo "=== File type ==="

          file ttyd/build/ttyd.exe

      # ==========================================
      # Collect DLLs
      # ==========================================
      - name: Collect DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist

          cp ttyd/build/ttyd.exe dist/

          echo "=== Dependencies ==="

          ldd ttyd/build/ttyd.exe || true

          echo "=== Copy DLLs ==="

          cp /mingw32/bin/libwebsockets*.dll dist/ || true
          cp /mingw32/bin/libssl*.dll dist/ || true
          cp /mingw32/bin/libcrypto*.dll dist/ || true
          cp /mingw32/bin/libjson-c*.dll dist/ || true
          cp /mingw32/bin/libgcc_s_*.dll dist/ || true
          cp /mingw32/bin/libstdc++-*.dll dist/ || true
          cp /mingw32/bin/libwinpthread-*.dll dist/ || true

          echo "=== DIST ==="

          ls -lah dist

      # ==========================================
      # ZIP
      # ==========================================
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/* `
            -DestinationPath ttyd-win32.zip

      # ==========================================
      # Upload
      # ==========================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttyd-windows-32bit
          path: ttyd-win32.zip
